use_default_settings: true

general:
  debug: false
  instance_name: "Qwry SearXNG"

server:
  # Overridden by SEARXNG_BASE_URL and SEARXNG_SECRET in the container environment.
  base_url: "http://127.0.0.1:8080/"
  secret_key: "replace-me-via-env"
  limiter: false
  image_proxy: true

search:
  formats:
    - html
    - json

engines:
  # Default general engines (duckduckgo, google, brave, qwant, startpage) are
  # frequently rate-limited/CAPTCHA'd and return no page results. Enable
  # reliable general engines as a fallback.
  - name: bing
    disabled: false
  - name: wiby
    disabled: false

ui:
  static_use_hash: true

redis:
  url: redis://127.0.0.1:6379/0
